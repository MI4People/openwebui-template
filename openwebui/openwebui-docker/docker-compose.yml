services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:${OPENWEBUI_VERSION:-main}
    restart: always
    container_name: openwebui
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8080"
    environment:
      - WEBUI_URL=https://YOUR_DOMAIN_HERE
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?fehlt in .env, bitte fill-template.sh ausfuehren}
      - ENABLE_SIGNUP=false
      - ENABLE_PERSISTENT_CONFIG=true
      # Kein "Neue Version verfügbar"-Banner: Updates laufen über openwebui-update
      - ENABLE_VERSION_UPDATE_CHECK=false
      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL:?fehlt in .env, bitte fill-template.sh ausfuehren}
      - WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD:?fehlt in .env, bitte fill-template.sh ausfuehren}
      - DATABASE_URL=postgresql://openwebui:${POSTGRES_PASSWORD:?fehlt in .env, bitte fill-template.sh ausfuehren}@postgres:5432/openwebui
    depends_on:
      - postgres
    volumes:
      - ./storage/openwebui:/app/backend/data
    networks:
      - proxy

  postgres:
    image: postgres:16-alpine
    restart: always
    container_name: openwebui-postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - POSTGRES_DB=openwebui
      - POSTGRES_USER=openwebui
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?fehlt in .env, bitte fill-template.sh ausfuehren}
      - TZ=Europe/Berlin
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data
    networks:
      - proxy

  nginx:
    image: nginx:1.30
    restart: always
    container_name: openwebui-nginx
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    depends_on:
      - openwebui
    networks:
      - proxy

  certbot:
    image: certbot/certbot
    container_name: openwebui-certbot
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    networks:
      - proxy

networks:
  proxy:
    driver: bridge
