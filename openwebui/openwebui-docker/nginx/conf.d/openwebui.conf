server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://YOUR_DOMAIN_HERE$request_uri;
    }
}

# BEGIN SSL
server {
    listen 443 ssl;
    server_name YOUR_DOMAIN_HERE;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    # Docker-DNS bei jeder Anfrage fragen (Cache 10 s). Mit festem
    # "proxy_pass http://openwebui:8080" merkt sich nginx die Container-IP
    # nur beim eigenen Start; nach Update, Reboot oder Absturz von Open WebUI
    # gäbe es sonst 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $openwebui_upstream http://openwebui:8080;

    location / {
        proxy_pass $openwebui_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 600s;
    }
}
# END SSL
